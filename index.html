<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unity Project Exporter</title>
  <style>
    :root {
      --bg-color: #1e1e2e;
      --card-bg: #2b2b3b;
      --accent: #89b4fa;
      --text: #cdd6f4;
      --text-dim: #a6adc8;
      --danger: #f38ba8;
      --success: #a6e3a1;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-top: 0;
      color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: #11111b;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background-color: #585b70;
      cursor: not-allowed;
    }

    .path-display {
      margin: 15px 0;
      padding: 10px;
      background: #181825;
      border-radius: 6px;
      font-family: monospace;
      word-break: break-all;
      color: var(--text-dim);
    }

    .checklist-container {
      margin-top: 20px;
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid #45475a;
      border-radius: 6px;
      padding: 10px;
    }

    .check-item {
      display: flex;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #313244;
    }

    .check-item:last-child {
      border-bottom: none;
    }

    .check-item input {
      margin-right: 12px;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
    }

    .badge-req {
      background: #f38ba8;
      color: #11111b;
      font-weight: bold;
    }

    .badge-opt {
      background: #45475a;
      color: var(--text-dim);
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Unity Exporter</h2>
    <button id="btnSelect">Seleccionar Proyecto Unity</button>
    <div id="pathDisplay" class="path-display">Ningún proyecto seleccionado</div>

    <div id="checklistWrapper" style="display: none;">
      <h3>Archivos y Carpetas a Incluir:</h3>
      <div id="checklist" class="checklist-container"></div>
      <br>
      <button id="btnExport">Exportar a .ZIP (Descargas)</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    let currentProjectPath = null;
    let projectItems = [];

    const btnSelect = document.getElementById('btnSelect');
    const btnExport = document.getElementById('btnExport');
    const pathDisplay = document.getElementById('pathDisplay');
    const checklistWrapper = document.getElementById('checklistWrapper');
    const checklist = document.getElementById('checklist');
    const status = document.getElementById('status');

    btnSelect.addEventListener('click', async () => {
      status.textContent = '';
      const data = await window.electronAPI.selectFolder();
      
      if (!data) return;

      currentProjectPath = data.projectPath;
      projectItems = data.items;

      pathDisplay.textContent = currentProjectPath;
      renderChecklist();
      checklistWrapper.style.display = 'block';
    });

    function renderChecklist() {
      checklist.innerHTML = '';

      projectItems.forEach(item => {
        const div = document.createElement('div');
        div.className = 'check-item';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = item.name;
        checkbox.checked = item.defaultChecked;
        
        // Si es obligatorio, bloquear para que no se desactive
        if (item.required) {
          checkbox.disabled = true;
        }

        const label = document.createElement('label');
        label.textContent = item.name + (item.isDirectory ? '/' : '');

        const badge = document.createElement('span');
        badge.className = 'badge ' + (item.required ? 'badge-req' : 'badge-opt');
        badge.textContent = item.required ? 'Obligatorio' : 'Opcional';

        div.appendChild(checkbox);
        div.appendChild(label);
        div.appendChild(badge);
        checklist.appendChild(div);
      });
    }

    btnExport.addEventListener('click', async () => {
      btnExport.disabled = true;
      status.style.color = 'var(--accent)';
      status.textContent = 'Comprimiendo proyecto y guardando en Descargas...';

      // Obtener todos los elementos marcados (incluyendo los deshabilitados requeridos)
      const checkboxes = checklist.querySelectorAll('input[type="checkbox"]:checked');
      const selectedItems = Array.from(checkboxes).map(cb => cb.value);

      try {
        const res = await window.electronAPI.exportZip({
          projectPath: currentProjectPath,
          selectedItems
        });

        if (res.success) {
          status.style.color = 'var(--success)';
          status.textContent = '¡Exportado con éxito! Se ha abierto la carpeta Descargas.';
        }
      } catch (err) {
        status.style.color = 'var(--danger)';
        status.textContent = 'Error al exportar: ' + err.message;
      } finally {
        btnExport.disabled = false;
      }
    });
  </script>
</body>
</html>
